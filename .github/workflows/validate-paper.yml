name: Validate changed papers

on:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk biber poppler-utils texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-bibtex-extra
      - name: Build affected papers and enforce four-page limit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: bash scripts/validate-changed.sh "$BASE_SHA" "$HEAD_SHA"

