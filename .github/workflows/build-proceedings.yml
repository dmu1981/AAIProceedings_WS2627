name: Build proceedings

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install TeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk biber poppler-utils texlive-latex-recommended texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-bibtex-extra
      - name: Validate all papers
        run: |
          for paper in papers/*; do
            [ -d "$paper" ] || continue
            bash "$paper/build.sh"
          done
      - name: Build proceedings from LaTeX sources
        run: bash proceedings/build.sh
      - name: Upload proceedings PDF
        uses: actions/upload-artifact@v4
        with:
          name: student-proceedings
          path: proceedings/proceedings.pdf
          if-no-files-found: error

